# Cloudflare API credentials for Let's Encrypt DNS challenge
# Copy this file to cloudflare.ini and update with your actual credentials

# Your Cloudflare account email
dns_cloudflare_email = your@email.com

# Your Cloudflare Global API Key (found in My Profile > API Tokens)
dns_cloudflare_api_token = your_global_api_token

# Security Notice:
# Keep this file secure and never commit it to version control
# Set restrictive permissions: chmod 600 cloudflare.ini