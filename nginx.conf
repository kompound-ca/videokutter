worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Hide nginx version for security
    server_tokens off;
    
    # Conditional logging based on LOG_REQUESTS env var
    ${LOG_REQUESTS_DIRECTIVE}
    
    # Core performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Gzip compression for text files only
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/json application/xml+rss
               application/x-font-ttf application/x-font-opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # Client body size limit (reasonable default for static site)
    client_max_body_size 25M;
    
    # Simple upstream to the Go server
    upstream app {
        server videocutter:8080;
        keepalive 32;
    }
    
    # HTTP server - Redirect to HTTPS or serve ACME challenges
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name ${DOMAIN};
        
        # Allow Let's Encrypt ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # HTTPS server - Main application
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ${DOMAIN};
        
        # SSL certificates from certbot
        ssl_certificate /etc/nginx/ssl/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/${DOMAIN}/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/live/${DOMAIN}/chain.pem;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        
        # SSL session optimization
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # OCSP stapling for better performance
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Content Security Policy for browser-based video app with FFmpeg WASM support
        add_header Content-Security-Policy "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:; worker-src 'self' blob: https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com blob: data:;" always;
        
        # Simple proxy configuration
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        
        # Health check endpoint (no caching)
        location = /api/health {
            proxy_pass http://app;
            access_log off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }
        
        # API config endpoint
        location = /api/config {
            proxy_pass http://app;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }
        
        # Static assets with long-term caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://app;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # HTML files with shorter cache
        location ~* \.html$ {
            proxy_pass http://app;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
        
        # WASM files with proper CORS headers
        location ~* \.wasm$ {
            proxy_pass http://app;
            add_header Content-Type "application/wasm";
            add_header Cache-Control "public, max-age=31536000";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            access_log off;
        }
        
        # Video files (if served)
        location ~* \.(mp4|webm|ogg|avi|mov|mkv)$ {
            proxy_pass http://app;
            
            # Support range requests for video seeking
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            
            # Cache for 1 hour
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            add_header Accept-Ranges bytes;
            access_log off;
        }
        
        # Main application
        location / {
            proxy_pass http://app;
            
            # Standard timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # Block sensitive files
        location ~ /\. {
            deny all;
            return 404;
        }
        
        location ~* \.(env|ini|conf|log|bak|backup|old|tmp)$ {
            deny all;
            return 404;
        }
    }
    
    # Catch-all for unknown domains - close connection
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;
        
        ssl_certificate /etc/nginx/ssl/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/${DOMAIN}/privkey.pem;
        ssl_reject_handshake on;
        
        return 444;
    }
}