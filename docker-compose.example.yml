networks:
  videocutter_network:
    driver: bridge

services:
  videocutter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"  # Always expose port for development access
    networks:
      - videocutter_network
    environment:
      - PORT=8080
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-production}
      - TEMP_DIR=/app/temp
      - LOG_REQUESTS=${LOG_REQUESTS:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10737418240}
      - DOMAIN=${DOMAIN:-videocutter.local}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - "${HOST_UPLOAD_DIR:-./temp}:/app/temp"
    init: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3200M
          cpus: '1.8'
        reservations:
          memory: 1600M
          cpus: '0.9'

  # Load balancer using nginx with SSL (only in production mode)
  nginx-lb:
    image: nginx:alpine
    container_name: videocutter-nginx-lb
    profiles:
      - production  # Only start with --profile production
    ports:
      - "80:80"
      - "443:443"
    networks:
      - videocutter_network
    environment:
      - DOMAIN=${DOMAIN:-videocutter.local}
      - MAX_BODY_SIZE=${MAX_BODY_SIZE:-15G}
      - LOG_REQUESTS=${LOG_REQUESTS:-false}
    volumes:
      - ./nginx-lb.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot-data:/var/www/certbot:ro
      - "${HOST_UPLOAD_DIR:-./temp}:/app/temp:ro"  # Mount temp directory for direct preview serving
    command: >
      sh -c "
      apk add --no-cache gettext &&
      if [ \"$${LOG_REQUESTS}\" = \"true\" ]; then
        export LOG_REQUESTS_DIRECTIVE='access_log /var/log/nginx/access.log;'
      else
        export LOG_REQUESTS_DIRECTIVE='access_log off;'
      fi &&
      envsubst '$${DOMAIN} $${MAX_BODY_SIZE} $${LOG_REQUESTS_DIRECTIVE}' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf &&
      echo 'Testing nginx configuration...' &&
      nginx -t &&
      echo 'Starting nginx...' &&
      nginx -g 'daemon off;'
      "
    restart: unless-stopped

  # Certbot for SSL certificates with Cloudflare DNS (only in production mode)
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: videocutter-certbot
    profiles:
      - production  # Only start with --profile production
    environment:
      - DOMAIN=${DOMAIN:-videocutter.local}
      - EMAIL=${SSL_EMAIL:-admin@${DOMAIN:-videocutter.local}}
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-data:/var/www/certbot
      - ./cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    command: >
      sh -c "
      echo 'Certbot DNS-Cloudflare: Obtaining/renewing certificate for ${DOMAIN}' &&
      certbot certonly 
        --dns-cloudflare
        --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
        --email $${EMAIL}
        --agree-tos
        --no-eff-email
        --non-interactive
        --expand
        --domains $${DOMAIN}
        --cert-name $${DOMAIN} &&
      echo 'Initial certificate process completed'
      "
    restart: "no"

  # Automatic certificate renewer (runs every 12 hours)
  certbot-renewer:
    image: certbot/dns-cloudflare:latest
    container_name: videocutter-certbot-renewer
    profiles:
      - production  # Only start with --profile production
    environment:
      - DOMAIN=${DOMAIN:-videocutter.local}
      - EMAIL=${SSL_EMAIL:-admin@${DOMAIN:-videocutter.local}}
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-data:/var/www/certbot
      - ./cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'echo "Starting certbot auto-renewer for ${DOMAIN}" &&
       echo "Renewer will check every 12 hours and reload nginx if renewed" &&
       while :; do
         echo "$(date): Checking certificate renewal for ${DOMAIN}..." &&
         if certbot renew 
             --dns-cloudflare
             --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
             --quiet
             --no-random-sleep-on-renew
             --deploy-hook "echo Certificate renewed, reloading nginx..."; then
           echo "$(date): Certificate check completed successfully" &&
           # Send HUP signal to nginx container to reload certificates
           docker kill -s HUP videocutter-nginx-lb 2>/dev/null || echo "Nginx container not found or already reloaded" 
         else
           echo "$(date): Certificate renewal check failed or not needed"
         fi &&
         echo "$(date): Sleeping for 12 hours..." &&
         sleep 43200
       done'
    restart: unless-stopped
    depends_on:
      - nginx-lb
