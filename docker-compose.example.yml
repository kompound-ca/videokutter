services:
  videocutter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kompound-videocutter
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - TEMP_DIR=/app/temp
    volumes:
      # Mount host directory for upload storage (configurable via .env)
      # Change HOST_UPLOAD_DIR in .env to specify where files are stored on your host
      - "${HOST_UPLOAD_DIR:-./uploads}:/app/temp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Optimized resource limits for small VMs
    deploy:
      resources:
        limits:
          memory: 2G     # Reduced for small VMs
          cpus: '2.0'    # Single CPU core
        reservations:
          memory: 512M   # Smaller reservation
          cpus: '0.5'    # Half CPU reserved
