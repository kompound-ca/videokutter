worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Security: Hide nginx version
    server_tokens off;
    
    # Conditional access logging - template substitution will replace ${LOG_REQUESTS}
    # When LOG_REQUESTS=false, this becomes "access_log off;"
    # When LOG_REQUESTS=true, this becomes "access_log /var/log/nginx/access.log;"
    ${LOG_REQUESTS_DIRECTIVE}
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Video-specific optimizations
    gzip off; # Disable gzip for video files (already compressed)
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/s;
    
    # Upstream configuration - All instances for general requests
    # Optional: Enable ip_hash for session stickiness (same IP → same container)
    upstream videocutter_backend {
        # ip_hash;  # Uncomment for session stickiness (reduces cross-container requests)
        least_conn;
        server videocutter-videocutter-1:8080 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }
    
    # Upload-only backend - Instance 1 handles all uploads to avoid I/O contention
    upstream videocutter_upload_backend {
        server videocutter-videocutter-1:8080 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # Security: Redirect ALL HTTP traffic to HTTPS (no exceptions)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Only allow ACME challenge for Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://${DOMAIN}$request_uri;
        }
    }
    
    # Security: HTTPS-only server with maximum security
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ${DOMAIN};
        
        # SSL Configuration - Maximum Security
        ssl_certificate /etc/nginx/ssl/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/${DOMAIN}/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/live/${DOMAIN}/chain.pem;
        
        # TLS 1.2+ ONLY - NO TLS 1.1 or lower
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Strong ciphers only (Modern configuration)
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve secp384r1;
        
        # SSL session configuration
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # Maximum Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # Remove potentially dangerous headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        
        # Client settings for video uploads (memory-optimized for large chunks)
        client_max_body_size ${MAX_BODY_SIZE};
        client_body_timeout 600s; # Longer timeout for large chunks
        client_header_timeout 60s;
        client_body_buffer_size 32M; # Much larger buffer for efficient chunk processing
        client_header_buffer_size 4k;
        large_client_header_buffers 8 8k; # Increased for better header handling
        
        # Proxy settings optimized for video streaming and memory usage
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s; # Increased for large video processing
        proxy_read_timeout 600s; # Increased for large video processing
        proxy_buffering on;  # Enable for better memory utilization
        proxy_request_buffering off; # Keep off for uploads to reduce latency
        proxy_max_temp_file_size 0;
        proxy_buffer_size 64k; # Larger proxy buffers for video metadata
        proxy_buffers 16 64k;  # More buffers for better video throughput
        proxy_busy_buffers_size 128k;
        proxy_temp_file_write_size 64k;
        
        # Security proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        
        # Health check endpoint (no rate limiting for monitoring)
        location = /api/health {
            proxy_pass http://videocutter_backend;
            access_log off;
        }
        
        # Upload endpoints - Route to dedicated upload instance (videocutter-1)
        location ~* ^/api/(upload|convert) {
            limit_req zone=upload burst=15 nodelay; # Increased burst for parallel chunks
            limit_req_status 429;
            
            # Route all uploads to instance 1 to avoid I/O contention
            proxy_pass http://videocutter_upload_backend;
            
            # Special handling for uploads - no buffering
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Increased timeouts for large file assembly
            proxy_send_timeout 900s; # 15 minutes for large file operations
            proxy_read_timeout 900s;
            
            # Memory-optimized settings for upload endpoints
            client_body_in_file_only clean;
            client_body_buffer_size 32M; # Larger buffer for 5MB chunks
            client_body_in_single_buffer on; # Force single buffer for better performance
        }
        
        # Video processing endpoints (metadata, cut, preview generation)
        location ~* ^/api/(metadata|cut|preview|generate-preview) {
            limit_req zone=api burst=5 nodelay;
            limit_req_status 429;
            
            # Extended timeouts for video processing operations
            proxy_send_timeout 1200s; # 20 minutes for heavy operations
            proxy_read_timeout 1200s;
            proxy_connect_timeout 60s;
            
            proxy_pass http://videocutter_backend;
        }
        
        # API endpoints with standard rate limiting
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://videocutter_backend;
        }
        
        # Static files with security headers
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://videocutter_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            access_log off;
        }
        
        # Generated preview files - Serve directly from nginx for maximum performance
        location /temp/ {
            internal; # Only accessible via X-Accel-Redirect from Go app
            alias /app/temp/;
            
            # Aggressive caching for generated previews
            expires 24h;
            add_header Cache-Control "public, max-age=86400, immutable";
            add_header ETag on;
            
            # Enable range requests for video seeking
            add_header Accept-Ranges bytes;
            
            # CORS headers for preview files
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, If-Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
            
            # Security headers
            add_header X-Content-Type-Options nosniff;
            add_header Content-Security-Policy "default-src 'none'; media-src 'self'";
            
            # Video-specific optimizations
            tcp_nopush on;
            sendfile on;
            sendfile_max_chunk 2m;
            
            # Only serve video files from temp directory
            location ~* /temp/.*\.(mp4|webm|jpg|jpeg|png)$ {
                # Enable range requests at file level
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin "*";
                    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                    add_header Access-Control-Allow-Headers "Range, If-Range";
                    add_header Access-Control-Max-Age 86400;
                    return 204;
                }
            }
        }
        
        # Video files with optimized streaming and security (fallback for non-temp files)
        location ~* \.(mp4|webm|ogg|avi|mov|wmv|flv|mkv|m4v)$ {
            proxy_pass http://videocutter_backend;
            
            # Enable range requests for video seeking
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_no_cache $http_range $http_if_range;
            
            # Optimized proxy settings for video streaming
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_temp_file_write_size 128k;
            proxy_busy_buffers_size 256k;
            
            # Security and caching
            expires 1h; # Shorter cache for preview files that may be regenerated
            add_header Cache-Control "public, must-revalidate";
            add_header X-Content-Type-Options nosniff;
            
            # CORS headers for video preview (if needed)
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
        }
        
        # Block access to sensitive files
        location ~* \.(env|ini|conf|log|bak|backup|old|tmp|temp)$ {
            deny all;
            return 404;
        }
        
        # Block access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }
        
        # Default location
        location / {
            proxy_pass http://videocutter_backend;
        }
        
        # Custom error pages (don't reveal server info)
        error_page 400 401 403 404 /40x.html;
        location = /40x.html {
            return 404 "Not Found";
            add_header Content-Type text/plain;
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 503 "Service Temporarily Unavailable";
            add_header Content-Type text/plain;
            internal;
        }
    }
    
    # Security: Block all access to non-HTTPS on any other server name
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;
        
        # Use same SSL certs but return 444 (close connection)
        ssl_certificate /etc/nginx/ssl/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/${DOMAIN}/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        
        return 444;  # Close connection immediately
    }
}
